[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pragmas-sdk"
version = "0.1.0"
description = "Official Python client for the PRAGMAS API — operational intelligence agent, analysis templates, and market search."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "PRAGMAS" }]
keywords = ["pragmas", "api-client", "sdk", "financial-analysis", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.5",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://pragmas.io"
Repository = "https://github.com/pragmasg/pragmas-sdk"
Issues = "https://github.com/pragmasg/pragmas-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pragmas_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
